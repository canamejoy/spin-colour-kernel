# Publish to PyPI when a version tag (v*) is pushed, through PyPI trusted publishing (no API token stored).
# One-time setup on pypi.org: Account settings -> Publishing -> add a pending publisher with
#   project spin-colour-kernel, owner canamejoy, repository spin-colour-kernel, workflow publish.yml, environment pypi.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: The tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: The wheel installs and imports without a GPU
        run: |
          python -m pip install --no-deps dist/*.whl numpy scipy matplotlib
          python -c "import sck; assert sck.check(crystal='sc', box=[8, 8, 8])['ok']; print(sck.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
